[project]
name = "aero-gui"
version = "0.1.0"
description = "Atmospheric particle data analysis platform — data visualisation, measurement modelling, inversion, parameter estimation and GDE simulation"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pyqt5>=5.15",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "openpyxl>=3.1",
]

[project.scripts]
# Launch the GUI from anywhere in the project with:  uv run aero-gui
aero-gui = "main:main"

[tool.uv]
# uv manages the virtual environment; do not edit .venv manually.
# Run the app:   uv run aero-gui
# Sync deps:     uv sync
# Add a package: uv add <pkg>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modules", "ui"]

# ── Optional: code quality tools (run with `uvx ruff check .`) ────────
[tool.ruff]
line-length = 100
target-version = "py310"
